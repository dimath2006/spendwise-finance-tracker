name: SpendWise CI/CD Pipeline


on:
  push:
    branches:
      - main



jobs:


# ---------------------------
# JOB 1: BUILD
# ---------------------------

  build:

    name: Build Application

    runs-on: ubuntu-latest


    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install Dependencies
      run: |
        pip install -r requirements.txt


    - name: Build Docker Image
      run: |
        docker build -t spendwise .




# ---------------------------
# JOB 2: INTEGRATION TESTING
# ---------------------------

  integration-testing:

    name: Integration Testing

    needs: build

    runs-on: ubuntu-latest


    steps:


    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install Dependencies
      run: |
        pip install -r requirements.txt


    - name: Run Integration Tests
      run: |
        PYTHONPATH=. pytest





# ---------------------------
# JOB 3: FUNCTIONAL TESTING
# ---------------------------

  functional-testing:


    name: Functional Testing

    needs: build

    runs-on: ubuntu-latest


    steps:


    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install Dependencies
      run: |
        pip install -r requirements.txt


    - name: Run Functional Tests
      run: |
        PYTHONPATH=. pytest





# ---------------------------
# JOB 4: DEPLOY
# ---------------------------

  deploy:


    name: Deploy Docker Image


    needs:
      - integration-testing
      - functional-testing


    runs-on: ubuntu-latest



    steps:


    - name: Checkout Code
      uses: actions/checkout@v4



    - name: Login Docker Hub
      uses: docker/login-action@v3

      with:

        username: ${{ secrets.DOCKER_USERNAME }}

        password: ${{ secrets.DOCKER_PASSWORD }}



    - name: Build and Push Docker Image

      uses: docker/build-push-action@v5

      with:

        context: .

        push: true

        tags: dimath2006/spendwise:latest