<!DOCTYPE html>
<html>

<head>

<title>SpendWise</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f5f5f5;
}


.container{
    background:white;
    padding:30px;
    border-radius:10px;
}


h1{
    font-size:40px;
}


button, .btn{

    background:#28a745;
    color:white;
    padding:12px 25px;
    text-decoration:none;
    border:none;
    border-radius:5px;

}


table{

    width:100%;
    margin-top:30px;
    border-collapse:collapse;

}


th,td{

    border:1px solid #aaa;
    padding:15px;
    text-align:center;

}


th{

    background:#f2f2f2;

}

</style>


</head>


<body>


<div class="container">


<h1>
💰 SpendWise
</h1>


<h2>
Personal Finance Expense Tracker
</h2>



<h2>
Total Expense: Rs. {{ total }}
</h2>



<a class="btn" href="/add_expense">
Add Expense
</a>



<h2>
Expense History
</h2>



<table>


<tr>

<th>
Name
</th>


<th>
Category
</th>


<th>
Amount
</th>


</tr>



{% for expense in expenses %}


<tr>


<td>
{{ expense.name }}
</td>


<td>
{{ expense.category }}
</td>


<td>
Rs. {{ expense.amount }}
</td>


</tr>


{% endfor %}



</table>


</div>


</body>

</html>
